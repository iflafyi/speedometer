<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07090d">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>GPS Спідометр</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen dashboard — gauge on top, trip stats grid below, controls bar at the bottom */
:root{
  --bg:#07090d; --panel:#10141b; --line:#1e2531; --fg:#e8ecf2; --dim:#7d8796;
  --accent:#ff8a1f; --accent2:#ffb15c; --warn:#ff3b3b; --ok:#3ddc84;
  --f-display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;
  -webkit-tap-highlight-color:transparent;user-select:none;overflow:hidden;
  padding:env(safe-area-inset-top,0) max(12px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0) max(12px,env(safe-area-inset-left,0px))}
.app{height:100%;display:flex;flex-direction:column;gap:10px;max-width:560px;margin:0 auto;padding-block:10px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px}
.gps{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
.dot{width:9px;height:9px;border-radius:50%;background:var(--dim)}
.dot.ok{background:var(--ok);box-shadow:0 0 10px var(--ok)}
.dot.wait{background:var(--accent);animation:pulse 1s infinite}
.dot.err{background:var(--warn)}
@keyframes pulse{50%{opacity:.3}}
.unit-toggle{font-family:var(--f-display);background:var(--panel);border:1px solid var(--line);color:var(--fg);
  border-radius:8px;padding:6px 10px;font-size:13px;letter-spacing:.05em;cursor:pointer}

.gauge-wrap{position:relative;flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center}
#gauge{width:100%;height:100%;max-height:440px}
.readout{position:absolute;left:0;right:0;top:50%;transform:translateY(-38%);text-align:center;pointer-events:none}
.speed{font-family:var(--f-display);font-weight:700;font-size:clamp(84px,26vw,150px);line-height:.9;
  font-variant-numeric:tabular-nums;letter-spacing:-.02em;transition:color .2s}
.speed.over{color:var(--warn);text-shadow:0 0 30px rgba(255,59,59,.5)}
.unit{font-family:var(--f-display);color:var(--accent);font-size:16px;letter-spacing:.2em;margin-top:4px}
.heading{font-family:var(--f-display);color:var(--dim);font-size:15px;margin-top:6px;letter-spacing:.1em}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stat{background:var(--panel);padding:10px 10px 9px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .k{font-size:10.5px;color:var(--dim);letter-spacing:.09em;text-transform:uppercase}
.stat .v{font-family:var(--f-display);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat .v small{font-size:12px;color:var(--dim);font-weight:400;margin-left:3px}

.controls{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}
.btn{font-family:var(--f-body);font-weight:600;font-size:13px;background:var(--panel);color:var(--fg);
  border:1px solid var(--line);border-radius:12px;padding:12px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.btn span{font-size:10.5px;color:var(--dim);font-weight:400}
.btn.primary{background:var(--accent);color:#1a0d00;border-color:var(--accent)}
.btn.primary span{color:#4a2600}
.btn.on{border-color:var(--accent);color:var(--accent2)}
.btn:focus-visible,.unit-toggle:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}

.limit-row{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.limit-row label{font-size:12px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase;flex:0 0 auto}
.limit-row input{flex:1;accent-color:var(--accent)}
.sign{width:42px;height:42px;border-radius:50%;border:4px solid var(--warn);background:#fff;color:#111;
  font-family:var(--f-display);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.sign.off{border-color:var(--line);background:var(--panel);color:var(--dim);font-size:11px}

.msg{font-size:12.5px;color:var(--dim);text-align:center;min-height:1.2em;line-height:1.4}
.msg.err{color:var(--warn)}

/* HUD: mirrored for windshield reflection, everything except speed hidden */
body.hud .stats,body.hud .limit-row,body.hud header,body.hud .msg,body.hud #gauge{display:none}
body.hud .readout{position:static;transform:none}
body.hud .gauge-wrap{transform:scaleY(-1)}
body.hud .speed{font-size:min(55vw,48vh);color:var(--accent2)}
body.hud .unit{font-size:24px}
body.hud .controls{opacity:.35}

@media (max-height:640px){ .stat .v{font-size:18px} .stat{padding:7px 8px} .btn{padding:9px 4px} .limit-row{padding:5px 10px} .sign{width:34px;height:34px} }
@media (prefers-reduced-motion:reduce){ .dot.wait{animation:none} }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="gps"><div class="dot" id="dot"></div><span id="gpsText">GPS вимкнено</span></div>
    <button class="unit-toggle" id="unitBtn" aria-label="Змінити одиниці">KM/H</button>
  </header>

  <div class="gauge-wrap">
    <canvas id="gauge" aria-hidden="true"></canvas>
    <div class="readout">
      <div class="speed" id="speed">0</div>
      <div class="unit" id="unitLbl">KM/H</div>
      <div class="heading" id="heading">— —</div>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><div class="k">Макс.</div><div class="v" id="sMax">0<small>km/h</small></div></div>
    <div class="stat"><div class="k">Середня</div><div class="v" id="sAvg">0<small>km/h</small></div></div>
    <div class="stat"><div class="k">Дистанція</div><div class="v" id="sDist">0.00<small>km</small></div></div>
    <div class="stat"><div class="k">У дорозі</div><div class="v" id="sTime">0:00</div></div>
    <div class="stat"><div class="k">0–100</div><div class="v" id="s0100">—</div></div>
    <div class="stat"><div class="k">Висота</div><div class="v" id="sAlt">—</div></div>
  </div>

  <div class="limit-row">
    <div class="sign off" id="sign">OFF</div>
    <label for="limit">Ліміт</label>
    <input type="range" id="limit" min="0" max="160" step="10" value="0">
  </div>

  <div class="controls">
    <button class="btn primary" id="startBtn">Старт<span>GPS</span></button>
    <button class="btn" id="resetBtn">Скинути<span>поїздку</span></button>
    <button class="btn" id="hudBtn">HUD<span>на скло</span></button>
    <button class="btn" id="demoBtn">Демо<span>тест</span></button>
  </div>
  <div class="msg" id="msg">Натисни «Старт» і дозволь доступ до геолокації.</div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const cv = $('gauge'), ctx = cv.getContext('2d');
  const store = { get(k,d){try{const v=localStorage.getItem('spd_'+k);return v===null?d:JSON.parse(v)}catch{return d}},
                  set(k,v){try{localStorage.setItem('spd_'+k,JSON.stringify(v))}catch{}} };

  let mph = store.get('mph', false);
  let limitKmh = store.get('limit', 0);
  let watchId = null, demoTimer = null, wakeLock = null;
  let shown = 0, target = 0;                 // km/h
  let trip = freshTrip();
  let last = null;                            // last position {lat,lon,t}
  let accelStart = null;                      // for 0-100
  let beeped = false, audioCtx = null;

  function freshTrip(){ return {max:0, dist:0, moving:0, startT:null, best0100:null}; }

  // ---------- units ----------
  const conv = kmh => mph ? kmh*0.621371 : kmh;
  const uSpeed = () => mph ? 'MPH' : 'KM/H';
  const uDist = () => mph ? 'mi' : 'km';
  function applyUnits(){
    $('unitBtn').textContent = uSpeed(); $('unitLbl').textContent = uSpeed();
    renderLimitSign(); renderStats(); drawGauge();
  }

  // ---------- gauge ----------
  function gaugeMax(){ return mph ? 140 : 220; }
  function resize(){
    const r = cv.getBoundingClientRect(), d = devicePixelRatio||1;
    cv.width = r.width*d; cv.height = r.height*d; ctx.setTransform(d,0,0,d,0,0); drawGauge();
  }
  function drawGauge(){
    const w = cv.clientWidth, h = cv.clientHeight; if(!w||!h) return;
    ctx.clearRect(0,0,w,h);
    const cx = w/2, cy = h*0.54, R = Math.min(w*0.46, h*0.5);
    const a0 = Math.PI*0.75, a1 = Math.PI*2.25, max = gaugeMax();
    const val = Math.min(conv(shown), max);
    const ang = v => a0 + (a1-a0)*(v/max);

    // track
    ctx.lineCap='round'; ctx.lineWidth = R*0.07;
    ctx.strokeStyle='#161b24'; ctx.beginPath(); ctx.arc(cx,cy,R,a0,a1); ctx.stroke();
    // limit zone
    if(limitKmh>0){ const lim=Math.min(conv(limitKmh),max);
      ctx.strokeStyle='rgba(255,59,59,.28)'; ctx.beginPath(); ctx.arc(cx,cy,R,ang(lim),a1); ctx.stroke(); }
    // value arc
    if(val>0.3){
      const g = ctx.createLinearGradient(cx-R,cy,cx+R,cy);
      g.addColorStop(0,'#ff6a00'); g.addColorStop(1,'#ffc46b');
      const over = limitKmh>0 && shown>limitKmh;
      ctx.strokeStyle = over ? '#ff3b3b' : g;
      ctx.shadowColor = over ? 'rgba(255,59,59,.7)' : 'rgba(255,138,31,.6)'; ctx.shadowBlur = 18;
      ctx.beginPath(); ctx.arc(cx,cy,R,a0,ang(val)); ctx.stroke(); ctx.shadowBlur=0;
    }
    // ticks + labels
    const step = mph ? 10 : 20;
    ctx.font = `600 ${Math.max(10,R*0.075)}px "Chakra Petch",sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    for(let v=0; v<=max; v+=step/2){
      const a = ang(v), major = v%step===0;
      const r1 = R*0.86, r2 = major ? R*0.76 : R*0.81;
      ctx.strokeStyle = v<=val ? '#ffb15c' : (major?'#5b6576':'#2f3744');
      ctx.lineWidth = major?2.5:1.5;
      ctx.beginPath(); ctx.moveTo(cx+Math.cos(a)*r1, cy+Math.sin(a)*r1); ctx.lineTo(cx+Math.cos(a)*r2, cy+Math.sin(a)*r2); ctx.stroke();
      if(major){ ctx.fillStyle = v<=val ? '#e8ecf2' : '#7d8796';
        ctx.fillText(v, cx+Math.cos(a)*R*0.65, cy+Math.sin(a)*R*0.65); }
    }
    // needle tip marker
    const a = ang(val);
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(cx+Math.cos(a)*R, cy+Math.sin(a)*R, R*0.045, 0, 7); ctx.fill();
  }

  // ---------- animation loop ----------
  function tick(){
    shown += (target-shown)*0.18;
    if(Math.abs(target-shown)<0.05) shown=target;
    const s = Math.round(conv(shown));
    $('speed').textContent = s;
    $('speed').classList.toggle('over', limitKmh>0 && shown>limitKmh);
    drawGauge();
    requestAnimationFrame(tick);
  }

  // ---------- GPS ----------
  function haversine(a,b){
    const R=6371000, toR=x=>x*Math.PI/180;
    const dLat=toR(b.lat-a.lat), dLon=toR(b.lon-a.lon);
    const s=Math.sin(dLat/2)**2+Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLon/2)**2;
    return 2*R*Math.asin(Math.sqrt(s));
  }
  const dirs=['Пн','ПнСх','Сх','ПдСх','Пд','ПдЗх','Зх','ПнЗх'];
  function compass(deg){ return dirs[Math.round(deg/45)%8]+' · '+Math.round(deg)+'°'; }

  function onPos(p){
    const c = p.coords, t = p.timestamp || Date.now();
    const cur = {lat:c.latitude, lon:c.longitude, t};
    let kmh = (c.speed!=null && !isNaN(c.speed)) ? c.speed*3.6 : null;
    if(last){
      const dt=(t-last.t)/1000, d=haversine(last,cur);
      if(kmh===null && dt>0) kmh = d/dt*3.6;
      // count distance only if accuracy is decent and we're moving
      if((c.accuracy||0) < 40 && (kmh||0) > 2) { trip.dist += d; trip.moving += dt; }
    }
    if(kmh===null) kmh=0;
    if(kmh<1.5) kmh=0;           // GPS jitter while parked
    last = cur;
    if(!trip.startT) trip.startT = Date.now();
    update(kmh, c.heading, c.altitude);
    setStatus('ok', `GPS ±${Math.round(c.accuracy)} м`);
    $('msg').textContent=''; $('msg').className='msg';
  }
  function onErr(e){
    const map={1:'Доступ до геолокації заборонено. Дозволь його в налаштуваннях браузера для цього сайту.',
               2:'Не вдається визначити позицію. Вийди на відкрите небо.',3:'GPS не відповідає, чекаю сигнал…'};
    setStatus(e.code===3?'wait':'err', e.code===3?'Пошук…':'Помилка');
    $('msg').textContent = map[e.code]||e.message; $('msg').className='msg err';
  }

  function update(kmh, heading, alt){
    target = kmh;
    if(kmh>trip.max) trip.max=kmh;
    // 0-100 timer
    const now=performance.now();
    if(kmh<3) accelStart=now;
    else if(accelStart && kmh>=100){
      const sec=(now-accelStart)/1000;
      if(sec<40 && (!trip.best0100 || sec<trip.best0100)) trip.best0100=sec;
      accelStart=null;
    }
    $('heading').textContent = (heading!=null && !isNaN(heading) && kmh>3) ? compass(heading) : '— —';
    $('sAlt').innerHTML = alt!=null ? `${Math.round(mph?alt*3.281:alt)}<small>${mph?'ft':'m'}</small>` : '—';
    // over-limit beep
    const over = limitKmh>0 && kmh>limitKmh;
    if(over && !beeped){ beep(); if(navigator.vibrate) navigator.vibrate([150,80,150]); }
    beeped = over;
    renderStats();
  }

  function renderStats(){
    const u=uSpeed().toLowerCase();
    $('sMax').innerHTML = `${Math.round(conv(trip.max))}<small>${u}</small>`;
    const avg = trip.moving>0 ? trip.dist/trip.moving*3.6 : 0;
    $('sAvg').innerHTML = `${Math.round(conv(avg))}<small>${u}</small>`;
    const d = mph ? trip.dist/1609.34 : trip.dist/1000;
    $('sDist').innerHTML = `${d.toFixed(d<100?2:1)}<small>${uDist()}</small>`;
    $('s0100').innerHTML = trip.best0100 ? `${trip.best0100.toFixed(1)}<small>с</small>` : '—';
  }
  setInterval(()=>{
    if(!trip.startT){ $('sTime').textContent='0:00'; return; }
    const s=Math.floor((Date.now()-trip.startT)/1000), h=Math.floor(s/3600), m=Math.floor(s%3600/60), ss=s%60;
    $('sTime').textContent = h ? `${h}:${String(m).padStart(2,'0')}:${String(ss).padStart(2,'0')}` : `${m}:${String(ss).padStart(2,'0')}`;
  },1000);

  function setStatus(cls, txt){ $('dot').className='dot '+cls; $('gpsText').textContent=txt; }

  async function start(){
    stopDemo();
    if(watchId!==null){ stop(); return; }
    if(!('geolocation' in navigator)){ onErr({code:2,message:'Цей браузер не підтримує геолокацію.'}); return; }
    if(!isSecureContext){ $('msg').textContent='Геолокація працює лише через https:// — відкрий сторінку з сайту, а не як файл.'; $('msg').className='msg err'; }
    setStatus('wait','Пошук супутників…');
    watchId = navigator.geolocation.watchPosition(onPos, onErr, {enableHighAccuracy:true, maximumAge:0, timeout:15000});
    $('startBtn').innerHTML='Стоп<span>GPS</span>';
    keepAwake();
  }
  function stop(){
    if(watchId!==null) navigator.geolocation.clearWatch(watchId);
    watchId=null; target=0; last=null;
    setStatus('', 'GPS вимкнено');
    $('startBtn').innerHTML='Старт<span>GPS</span>';
    releaseWake();
  }

  // ---------- demo ----------
  function startDemo(){
    if(watchId!==null) stop();
    if(demoTimer){ stopDemo(); return; }
    let t=0; trip.startT=trip.startT||Date.now();
    $('demoBtn').classList.add('on'); setStatus('wait','Демо-режим');
    demoTimer=setInterval(()=>{
      t+=0.5;
      const cyc=t%40;
      const kmh = cyc<12 ? 100*(1-Math.exp(-cyc/4.5))*1.1 : cyc<28 ? 95+Math.sin(t)*12 : Math.max(0,95-(cyc-28)*9);
      trip.dist += kmh/3.6*0.5; if(kmh>2) trip.moving+=0.5;
      update(kmh, (t*6)%360, 180+Math.sin(t/10)*20);
    },500);
  }
  function stopDemo(){ if(demoTimer){clearInterval(demoTimer); demoTimer=null; target=0; $('demoBtn').classList.remove('on'); setStatus('','GPS вимкнено');} }

  // ---------- extras ----------
  async function keepAwake(){ try{ if('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); }catch{} }
  function releaseWake(){ try{ wakeLock && wakeLock.release(); }catch{} wakeLock=null; }
  document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && watchId!==null) keepAwake(); });

  function beep(){
    try{
      audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.frequency.value=880; o.type='square'; g.gain.value=0.08;
      o.connect(g); g.connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+0.25);
    }catch{}
  }

  function renderLimitSign(){
    const s=$('sign');
    if(limitKmh>0){ s.className='sign'; s.textContent=Math.round(conv(limitKmh)); }
    else { s.className='sign off'; s.textContent='OFF'; }
  }

  // ---------- wiring ----------
  $('startBtn').onclick = () => { if(!audioCtx){ try{audioCtx=new (window.AudioContext||window.webkitAudioContext)()}catch{} } start(); };
  $('demoBtn').onclick = startDemo;
  $('resetBtn').onclick = () => { trip=freshTrip(); if(watchId!==null||demoTimer) trip.startT=Date.now(); last=null; renderStats(); };
  $('unitBtn').onclick = () => { mph=!mph; store.set('mph',mph); applyUnits(); };
  $('hudBtn').onclick = () => { document.body.classList.toggle('hud'); $('hudBtn').classList.toggle('on'); };
  $('limit').value = limitKmh;
  $('limit').oninput = e => { limitKmh=+e.target.value; store.set('limit',limitKmh); renderLimitSign(); };

  addEventListener('resize', resize);
  applyUnits(); resize(); requestAnimationFrame(tick);
})();
</script>
</body>
</html>
